interface:
  display_name: "秀米原生模板排版"
  short_description: "原生组件作为素材库，按原稿内容编排，保真排版并审稿，输出 v4 一键导入包"
  default_prompt: "使用 $xiumi-native-layout，先阅读用户完整文案并保留内容和叙事顺序，将抓取包当作可自由选用的原生组件素材库，识别标题、分割线、正文、图片和图注组件，再根据文案重新选用与编排。审查居中段落的语义断行、首行缩进是否适合实际段落与容器（不要只因长度而缩进），以及长英文是否需要西文打断；默认原文一字不改，先靠布局解决问题；当居中句尾剩一两个孤字时，合理选择语义断行或删去一两个不重要的字；通常零改字，但允许有视觉理由的小幅调整，实际改字须记录并在交付说明中列明，避免大幅概括或弱化人物描写，并保留原模板品牌尾图。识别 Word 原生表格并优先保留为真实秀米 classic-table-normal：从插件抓取包复用完整单元格结构，必要时从独立参考包导入，再按原稿完整行列与加粗生成 nativeTables；不把表格压成长文本或伪 HTML 表。完整保留原 Word 中的局部加粗，克制强调比分与关键信息，同层标题组件优先统一加粗，用 richText 保留真实原生 strong，并进行加粗审查。完成布局审核后交付可由支持 v4 原生协议的导入端处理的 .xiumi.json。"
policy:
  allow_implicit_invocation: true

